name: suga
description: "Turns ambient sound into light — a microphone-driven color visualizer."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  audio_streamer: ^4.3.0
  flutter:
    sdk: flutter
  permission_handler: ^12.0.3
  wakelock_plus: ^1.6.1
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # Cropped from assets/images/suga-logo.jpeg (the full source artwork,
    # kept out of the bundle).
    - assets/images/suga-mark.jpg
