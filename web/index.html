<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Replaced by the `--base-href` argument of `flutter build web`. Must start
    and end with "/".
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Suga turns music into light: a beat-reactive, full-screen color visualizer that listens through your microphone.">
  <!-- Matches SugaColors.night in lib/app/theme.dart. -->
  <meta name="theme-color" content="#0E161D">

  <!-- iOS home-screen app -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Suga">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <title>Suga</title>
  <style>
    /* Dark from the first paint, so loading never flashes white. */
    html, body { margin: 0; height: 100%; background: #0E161D; }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
